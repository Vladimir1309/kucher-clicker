<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кликер</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div>
        <h1>Кликер</h1>
        <h4>Нажимай на кнопку и увеличивай счет. Затем покупай улучшения</h4>
    </div>
    <div class="mainBlock">
        <button class="mainClick">Кликнуть</button>
        <p class="scoreAmount">Количество очков: 0</p>
        <p class="clicksAmount">Количество кликов: 0</p>
        <p class="scoreInSecond">Очков в секунду: 1</p>
        <button class="upgradeClickPower" disabled>+2 к силе клика<br>(Стоимость: 20 очков)</button>
        <button class="upgradeClickAutoPower" disabled>+2 к силе автоклика <br> (Стоимость: 20 очков)</button>
        <button class="resetClick">Сбросить</button>
    </div>
    <script src="script.js"></script>
</body>

</html>
